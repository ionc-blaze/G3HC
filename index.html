<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your garden games | The Giant Garden Games Hire Company</title>
<meta name="description" content="Choose a package, pick your games and a date, and send your booking request.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mrs+Saint+Delafield&family=Playfair+Display:wght@700;800&family=Poiret+One&display=swap" rel="stylesheet">
<style>
  /* Colours and fonts are matched by eye to the main website. Swap them here if Troy has the exact ones. */
  :root {
    --sand: #E5DCC8;
    --panel: #F6F3EE;
    --paper: #FFFFFF;
    --ink: #2B1A10;
    --muted: #5C4A3A;
    --taupe: #8B7355;
    --line: #CDBFA5;
    --brown: #3B2416;
    --brown-dark: #1F120A;
    --busy: #EBCB9A;
    --busy-edge: #C99A4B;
    --busy-ink: #4F3210;
    --open-edge: #B8A98A;
    --danger: #9B2C2C;
    --title: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --display: 'Poiret One', 'Cormorant Garamond', Georgia, serif;
    --script: 'Mrs Saint Delafield', 'Brush Script MT', cursive;
    --body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 20px; line-height: 1.45; }
  a { color: var(--brown); }
  a:hover { color: var(--brown-dark); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .site-header { background: #fff; text-align: center; padding: 14px 20px 18px; border-bottom: 1px solid var(--line); }
  .site-header img { width: 112px; height: auto; display: block; margin: 0 auto 6px; }
  .brand { font-family: var(--title); font-weight: 800; font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.15; }
  .brand a { color: var(--ink); text-decoration: none; }
  .back-link { font-size: 16px; margin-top: 4px; }

  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  .panel { background: var(--panel); padding: 28px 26px 32px; }
  .banner { background: var(--busy); border: 1px solid var(--busy-edge); color: var(--busy-ink); padding: 12px 16px; font-size: 17px; margin-bottom: 20px; }

  .steps { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 26px; }
  .steps li { padding: 5px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .steps li[aria-current="step"] { background: var(--brown); border-color: var(--brown); color: var(--panel); }
  .steps li.done { background: var(--sand); color: var(--ink); }

  h1 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 0 0 8px; text-align: center; }
  h1:focus { outline: none; }
  h2 { font-family: var(--script); font-weight: 400; font-size: 38px; line-height: 1; margin: 6px 0 2px; }
  .lede { color: var(--muted); margin: 0 0 18px; text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 20px; }

  .btn { border: 2px solid var(--brown); border-radius: 0; padding: 11px 28px; font-weight: 700; font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; min-height: 46px; }
  .btn-primary { background: var(--brown); color: var(--panel); }
  .btn-primary:hover { background: var(--brown-dark); border-color: var(--brown-dark); }
  a.btn-primary, a.btn-primary:hover { color: var(--panel); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  a.btn { display: inline-block; text-decoration: none; text-align: center; }
  .btn-quiet { background: none; border: 0; color: var(--brown); padding: 8px 0; min-height: 44px; font-weight: 700; text-decoration: underline; text-align: left; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; }

  .pkgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .pkg { text-align: left; background: var(--sand); border: 2px solid var(--ink); border-radius: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .pkg:hover { background: #DDD2BA; }
  .pkg[aria-pressed="true"] { background: var(--brown); color: var(--panel); }
  .pkg[aria-pressed="true"] .pkg-desc { color: var(--panel); }
  .pkg-name { font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: 0.03em; }
  .pkg-desc { color: var(--muted); font-size: 18px; }
  .pkg-price { font-family: var(--title); font-weight: 700; font-size: 26px; margin-top: 6px; }

  .pick-count { text-align: center; font-size: 20px; font-weight: 700; position: sticky; top: 0; background: var(--panel); padding: 8px 0; z-index: 2; border-bottom: 1px solid var(--line); }
  .group-title { font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 18px; margin: 4px 0 0; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--ink); padding: 10px 14px; background: var(--paper); cursor: pointer; min-height: 56px; }
  .opt:has(input:checked) { background: var(--sand); }
  .opt:has(input:disabled) { opacity: 0.5; cursor: not-allowed; }
  .opt input { width: 24px; height: 24px; margin-top: 2px; accent-color: var(--brown); flex: none; }
  .opt-name { font-weight: 700; display: block; }
  .opt-note { display: block; color: var(--muted); font-size: 17px; font-weight: 600; }
  .opt-price { font-family: var(--title); font-weight: 700; font-size: 18px; margin-left: auto; white-space: nowrap; padding-left: 8px; }

  .cal { background: var(--paper); border: 2px solid var(--ink); padding: 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-family: var(--display); font-size: 30px; }
  .cal-nav { width: 46px; height: 46px; border-radius: 0; border: 2px solid var(--ink); background: var(--paper); font-size: 22px; line-height: 1; }
  .cal-nav[disabled] { opacity: 0.3; cursor: not-allowed; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: 16px; font-weight: 700; color: var(--muted); padding: 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .day { min-height: 46px; border-radius: 0; border: 2px solid transparent; font-weight: 700; font-size: 18px; background: none; }
  .day--open { background: var(--panel); border-color: var(--open-edge); }
  .day--busy { background: var(--busy); border-color: var(--busy-edge); }
  .day--closed { color: #A39679; cursor: not-allowed; }
  .day[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: var(--panel); }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 17px; color: var(--muted); }
  .swatch { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -1px; border: 2px solid; }
  .swatch--open { background: var(--panel); border-color: var(--open-edge); }
  .swatch--busy { background: var(--busy); border-color: var(--busy-edge); }

  .opt-out { color: var(--danger); font-weight: 700; }
  .opt:has(input:disabled) { opacity: 0.6; cursor: not-allowed; background: var(--panel); }
  .note { padding: 14px 16px; font-size: 18px; border: 1px solid var(--line); background: var(--paper); }
  .note--busy { background: var(--busy); border-color: var(--busy-edge); color: var(--busy-ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .label { font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; }
  .hint { color: var(--muted); font-size: 17px; }
  .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field textarea, .field select {
    padding: 11px 12px; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); width: 100%; font-size: 20px;
  }
  .field textarea { resize: vertical; }
  .field [aria-invalid="true"] { border-color: var(--danger); }
  .err { color: var(--danger); font-size: 17px; font-weight: 700; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-size: 19px; }
  .check input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--brown); flex: none; }
  .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .form-error { background: #F6DEDA; border: 2px solid var(--danger); color: var(--danger); padding: 12px 16px; font-size: 18px; font-weight: 700; }

  .summary { background: var(--paper); border: 2px solid var(--ink); padding: 6px 20px; margin: 0; }
  .summary div { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .summary div:last-child { border-bottom: 0; }
  .summary dt { color: var(--muted); font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .summary dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .site-footer { background: #000; color: #fff; text-align: center; padding: 26px 20px 22px; font-size: 18px; }
  .site-footer a { color: #fff; }
  .site-footer p { margin: 4px 0; overflow-wrap: anywhere; }
  .site-footer .small { font-size: 16px; opacity: 0.85; margin-top: 14px; }
  .site-footer .credit { margin-top: 6px; }

  @media (max-width: 640px) {
    .panel { padding: 22px 16px 26px; }
    .pkgs, .opts { grid-template-columns: 1fr; }
    .summary div { grid-template-columns: 1fr; gap: 2px; }
    h1 { font-size: 32px; }
    .brand { font-size: 19px; }
  }
  @media (prefers-reduced-motion: no-preference) { .btn, .pkg, .day, .opt { transition: background 0.15s, border-color 0.15s; } }
</style>
</head>

    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var total = new Date(y, m + 1, 0).getDate();

    var cells = DOW.map(function (d) { return el('div', { class: 'dow', 'aria-hidden': 'true' }, d); });
    for (var b = 0; b < offset; b++) { cells.push(el('div', { 'aria-hidden': 'true' })); }
    for (var d = 1; d <= total; d++) {
      (function (day) {
        var s = iso(y, m, day);
        var status = dayStatus(s);
        var label = longDate(s) + (status === 'busy' ? ', busy, you can send an enquiry' : status === 'open' ? ', available' : ', not available');
        cells.push(el('button', {
          type: 'button',
          class: 'day day--' + status,
          disabled: status === 'closed',
          'aria-label': label,
          'aria-pressed': state.date === s ? 'true' : 'false',
          onclick: function () { state.date = s; render(true); }
        }, String(day)));
      })(d);
    }

    var chosenStatus = state.date ? dayStatus(state.date) : '';
    var p = pkg();

    return el('div', { class: 'stack' },
      el('div', null,
        el('button', { type: 'button', class: 'btn-quiet', onclick: function () { go(prevStep('date')); } }, '← Back'),
        heading('Pick a date'),
        el('p', { class: 'hint' }, 'Bookings start from tomorrow. Choose your date, then your set-up and pick-up times.'),
        el('p', { class: 'lede' }, p ? p.name + ' (' + p.price + ')' : '')
      ),
      el('div', { class: 'cal' },
        el('div', { class: 'cal-head' },
          el('button', { type: 'button', class: 'cal-nav', 'aria-label': 'Previous month', disabled: atStart, onclick: function () { shiftMonth(-1); } }, '‹'),
          el('div', { class: 'cal-title', 'aria-live': 'polite' }, MONTHS[m] + ' ' + y),
          el('button', { type: 'button', class: 'cal-nav', 'aria-label': 'Next month', disabled: atEnd, onclick: function () { shiftMonth(1); } }, '›')
        ),
        el('div', { class: 'cal-grid' }, cells)
      ),
      el('div', { class: 'legend' },
        el('span', null, el('span', { class: 'swatch swatch--open' }), 'Available'),
        el('span', null, el('span', { class: 'swatch swatch--busy' }), 'Busy: send an enquiry and we will see if we can fit you in')
      ),
      chosenStatus === 'open' && el('div', { class: 'note note--open' }, longDate(state.date) + ' looks free.'),
      chosenStatus === 'busy' && el('div', { class: 'note note--busy' },
        longDate(state.date) + ' is a busy day. You can still send a request and we will let you know if we can fit you in.'),
      state.date && chosenStatus !== 'closed' && el('div', { class: 'field' },
        el('label', { for: 'f-time' }, 'Arrival or set-up time'),
        el('span', { class: 'hint', id: 'f-time-hint' }, 'The time you would like us to be set up by. We allow ' + state.bufferMinutes + ' minutes before this to get ready.'),
        el('select', { id: 'f-time', name: 'time', 'aria-describedby': 'f-time-hint', onchange: function (e) {
          state.time = e.target.value;
          if (state.pickup && pickupChoices().indexOf(state.pickup) === -1) { state.pickup = ''; }
          render(true);
        } },
          el('option', { value: '', selected: !state.time }, 'Choose a time'),
          slotValues().map(function (v) {
            return el('option', { value: v, selected: state.time === v }, timeLabel(v) + (windowClash(state.date, v, '') ? ' (we will need to check)' : ''));
          })
        )
      ),
      state.date && state.time && chosenStatus !== 'closed' && el('div', { class: 'field' },
        el('label', { for: 'f-pickup' }, 'Pick-up time'),
        el('span', { class: 'hint', id: 'f-pickup-hint' }, 'The time you would like us to collect the games, up to 8pm. It needs to be at least an hour after set-up. We allow an hour for collecting.'),
        el('select', { id: 'f-pickup', name: 'pickup', 'aria-describedby': 'f-pickup-hint', onchange: function (e) { state.pickup = e.target.value; render(true); } },
          el('option', { value: '', selected: !state.pickup }, 'Choose a time'),
          pickupChoices().map(function (v) {
            return el('option', { value: v, selected: state.pickup === v }, timeLabel(v) + (windowClash(state.date, state.time, v) ? ' (we will need to check)' : ''));
          })
        )
      ),
      chosenStatus !== 'busy' && timeReview() && el('div', { class: 'note note--busy' },
        'Those times overlap another booking that day. You can still send a request and we will check whether it works and come back to you.'),
      chosenStatus !== 'busy' && !timeReview() && state.time && state.pickup && includedShort() && el('div', { class: 'note note--busy' },
        'Something in this package is already booked out for those times. You can still send a request and we will check and come back to you.'),
      el('div', { class: 'actions' },
        el('button', { type: 'button', class: 'btn btn-primary', disabled: !state.date || !state.time || !state.pickup, onclick: function () { go(nextStep('date')); } }, 'Continue')
      )
    );
  }

  /* ---------- step: details ---------- */
  function cleanPostcode(v) {
    var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    return /^[A-Z]{1,2}[0-9][A-Z0-9]?[0-9][A-Z]{2}$/.test(s) ? s.slice(0, s.length - 3) + ' ' + s.slice(-3) : '';
  }
  function isPostcode(v) { return !!cleanPostcode(v); }

  function validateForm() {
    var errs = {};
    var f = state.form;
    FIELDS.forEach(function (def) {
      if (def.required && !String(f[def.key]).trim()) { errs[def.key] = 'Please fill this in.'; }
    });
    if (!errs.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { errs.email = 'Please enter a valid email address.'; }
    if (!errs.postcode && !isPostcode(f.postcode)) { errs.postcode = 'Please enter a valid UK postcode, for example E1 1AA.'; }
    if (!f.terms) { errs.terms = 'Please confirm you accept the terms and conditions.'; }
    return errs;
  }

  function fieldView(def) {
    var id = 'f-' + def.key;
    var errId = id + '-err';
    var hintId = id + '-hint';
    var err = state.errors[def.key];
    var describedBy = [def.hint ? hintId : '', err ? errId : ''].filter(Boolean).join(' ');
    var common = {
      id: id,
      name: def.key,
      required: def.required,
      'aria-invalid': err ? 'true' : false,
      'aria-describedby': describedBy || false
    };
    var control;
    if (def.type === 'textarea') {
      control = el('textarea', Object.assign({ rows: String(def.rows || 3), maxlength: String(def.max), autocomplete: def.autocomplete || 'off', oninput: function (e) { state.form[def.key] = e.target.value; } }, common), state.form[def.key]);
    } else {
      control = el('input', Object.assign({ type: def.type, value: state.form[def.key], maxlength: String(def.max), autocomplete: def.autocomplete || 'off', oninput: function (e) { state.form[def.key] = e.target.value; } }, common));
    }
    return el('div', { class: 'field' },
      el('label', { for: id }, def.label + (def.required ? '' : ' (optional)')),
      def.hint && el('span', { class: 'hint', id: hintId }, def.hint),
      control,
      err && el('span', { class: 'err', id: errId }, err)
    );
  }

  function viewDetails() {
    var f = state.form;
    var errCount = Object.keys(state.errors).length;
    var form = el('form', {
      class: 'stack',
      novalidate: true,
      onsubmit: function (e) {
        e.preventDefault();
        state.errors = validateForm();
        if (Object.keys(state.errors).length) {
          render(true);
          var firstBad = appEl.querySelector('[aria-invalid="true"]');
          if (firstBad) { firstBad.focus(); }
          return;
        }
        requestDelivery();
        go(nextStep('details'));
      }
    },
      errCount > 0 && el('div', { class: 'form-error', role: 'alert' }, 'Please check the highlighted fields.'),
      FIELDS.map(fieldView),
      el('label', { class: 'check' },
        el('input', { type: 'checkbox', name: 'invoice', checked: f.invoice, onchange: function (e) { state.form.invoice = e.target.checked; } }),
        el('span', null, 'I will need an invoice')
      ),
      el('div', { class: 'field' },
        el('label', { class: 'check' },
          el('input', {
            type: 'checkbox', name: 'terms', checked: f.terms,
            'aria-invalid': state.errors.terms ? 'true' : false,
            onchange: function (e) { state.form.terms = e.target.checked; }
          }),
          el('span', null, 'I have read and accept the ',
            el('a', { href: CONFIG.TERMS_URL, target: '_blank', rel: 'noopener' }, 'terms and conditions'), '.')
        ),
        state.errors.terms && el('span', { class: 'err' }, state.errors.terms)
      ),
      // Hidden from people. Bots tend to fill it in, and those requests are ignored. The name is deliberately odd so browser autofill leaves it alone.
      el('div', { class: 'trap', 'aria-hidden': 'true' },
        el('label', { for: 'f-hp' }, 'Leave this field empty'),
        el('input', { type: 'text', id: 'f-hp', name: 'hp_x7q', tabindex: '-1', autocomplete: 'off', 'data-lpignore': 'true', oninput: function (e) { state.form.hp = e.target.value; } })
      ),
      el('div', { class: 'actions' },
        el('button', { type: 'submit', class: 'btn btn-primary' }, 'Review request'),
        el('button', { type: 'button', class: 'btn-quiet', onclick: function () { go(prevStep('details')); } }, 'Back')
      )
    );

    return el('div', { class: 'stack' },
      el('div', null,
        heading('Your details'),
        el('p', { class: 'lede' }, (pkg() ? pkg().name : '') + ' on ' + longDate(state.date))
      ),
      form
    );
  }

  /* ---------- step: review ---------- */
  function row(label, value) {
    return el('div', null, el('dt', null, label), el('dd', null, value || 'Not given'));
  }

  function viewReview() {
    var f = state.form;
    var p = pkg();
    var review = needsReview();

    return el('div', { class: 'stack' },
      el('div', null,
        heading('Check and send'),
        el('p', { class: 'lede' }, review
          ? (reviewReason() === 'busy' ? 'This is a busy day, so we will check whether we can fit you in before confirming.' : reviewReason() === 'stock' ? 'We will check that everything in your package is free on that day before confirming.' : 'Those times overlap another booking, so we will check it works before confirming.')
          : 'We will confirm your booking by email.')
      ),
      el('dl', { class: 'summary' },
        row('Package', p ? p.name + ' (' + p.price + ')' : ''),
        p && p.pick > 0 && row('Games', state.sel.join(', ')),
        p && p.extras && state.ext.length > 0 && row('Extras', state.ext.map(extraLabel).join('\n')),
        row('Date', longDate(state.date)),
        row('Arrival or set-up', state.time ? timeLabel(state.time) : ''),
        row('Pick-up', state.pickup ? timeLabel(state.pickup) : ''),
        row('Name', f.name),
        row('Email', f.email),
        row('Phone', f.phone),
        row('Venue', f.venue),
        row('Postcode', cleanPostcode(f.postcode) || f.postcode),
        row('Parking and access', f.access),
        row('Invoice needed', f.invoice ? 'Yes' : 'No')
      ),
      deliveryNote(),
      state.sendError && el('div', { class: 'form-error', role: 'alert' }, state.sendError),
      el('div', { class: 'actions' },
        el('button', {
          type: 'button', class: 'btn btn-primary', disabled: state.sending || state.delivery.status === 'loading',
          onclick: function () {
            state.sending = true;
            state.sendError = '';
            render(true);
            send().then(function (res) {
              state.sending = false;
              if (res && res.ok) {
                state.result = res.status === 'enquiry' ? 'enquiry' : 'provisional';
                state.resultReason = res.reason === 'time' ? 'time' : res.reason === 'stock' ? 'stock' : 'busy';
                state.emailed = !!res.emailed;
                go('done');
              } else {
                state.sendError = (res && res.error) || 'Something went wrong. Please call or email us instead.';
                render(true);
              }
            }).catch(function () {
              state.sending = false;
              state.sendError = 'We could not send your request. Please check your connection, or call or email us instead.';
              render(true);
            });
          }
        }, state.sending ? 'Sending...' : 'Send request'),
        el('button', { type: 'button', class: 'btn-quiet', disabled: state.sending, onclick: function () { go(prevStep('review')); } }, 'Back')
      )
    );
  }

  /* ---------- step: done ---------- */
  function viewDone() {
    var enquiry = state.result === 'enquiry';
    var why = state.resultReason;
    return el('div', { class: 'stack' },
      heading(!enquiry ? 'Request received' : why === 'time' ? 'Thanks, we will check those times' : why === 'stock' ? 'Thanks, we will check availability' : 'Thanks, we will check that date'),
      el('p', { class: 'lede' }, !enquiry
        ? 'We have noted ' + longDate(state.date) + ', set-up by ' + timeLabel(state.time) + ' and pick-up at ' + timeLabel(state.pickup) + ', and will confirm by email shortly.'
        : why === 'time'
        ? 'Those times overlap another booking, so we will check they work and come back to you by email.'
        : why === 'stock'
        ? 'We need to check that everything in your package is free on that day, and will come back to you by email.'
        : 'That day is busy, so we will see whether we can fit you in and come back to you by email.'),
      state.emailed && el('p', null, 'We have also emailed you a copy of your request' + (state.form.email ? ' at ' + state.form.email : '') + '. If you do not see it, please check your junk folder.'),
      el('p', null, 'Nothing is final until we have confirmed with you. If anything changes, call ' + CONFIG.CONTACT_PHONE + ' or email ' + CONFIG.CONTACT_EMAIL + '.'),
      DEMO && el('p', { class: 'hint' }, 'Demo mode: nothing was saved and no email was sent.'),
      el('div', { class: 'actions' },
        el('button', {
          type: 'button', class: 'btn btn-primary',
          onclick: function () {
            state.pkgId = ''; state.sel = []; state.ext = []; state.date = ''; state.time = ''; state.pickup = ''; state.errors = {}; state.sendError = '';
            state.delivery = { status: 'idle', postcode: '', inside: true, miles: 0, extra: 0 };
            state.emailed = false;
            state.form = blankForm();
            go('package');
          }
        }, 'Make another request')
      )
    );
  }

  /* ---------- start up ---------- */
  document.getElementById('contact').appendChild(document.createTextNode('Call ' + CONFIG.CONTACT_PHONE + ' or email '));
  document.getElementById('contact').appendChild(el('a', { href: 'mailto:' + CONFIG.CONTACT_EMAIL }, CONFIG.CONTACT_EMAIL));

  if (DEMO) {
    var banner = document.getElementById('banner');
    banner.textContent = BAD_URL
      ? 'Not connected: the SCRIPT_URL in index.html is a temporary copy (it starts script.googleusercontent.com), so nothing you send is saved. Replace it with the Web app URL from Deploy > Manage deployments in Apps Script. It starts https://script.google.com/macros/s/ and ends /exec.'
      : 'Demo mode: this page is showing sample dates and nothing you send is saved. Add the Apps Script address in index.html to connect it to the Google Sheet.';
    banner.hidden = false;
  }

  appEl.appendChild(el('p', { class: 'lede' }, 'Loading packages...'));
  renderSteps();

  load().then(function () { render(true); }).catch(function () {
    appEl.textContent = '';
    appEl.appendChild(el('div', { class: 'stack' },
      el('div', { class: 'form-error', role: 'alert' }, 'We could not load the booking page. Please try again, or call ' + CONFIG.CONTACT_PHONE + ' or email ' + CONFIG.CONTACT_EMAIL + '.'),
      el('div', { class: 'actions' },
        el('button', { type: 'button', class: 'btn btn-primary', onclick: function () { window.location.reload(); } }, 'Try again')
      )
    ));
  });
})();
</script>
</body>
</html>
